 display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#0c4a6e}
 .b{text-align:center;padding:20px} .b img{width:110px} .b p{margin:12px 0 0;font-size:14px}

</head><body><div class="b">
<img src="https://hyunjongki.github.io/youth/nongtus.png" alt="농투스">
<p>🌾 복합형 농촌일손여행 참가신청으로<br>이동 중입니다…</p>
<p id="m" style="font-size:12.5px;color:#5b7c8d"></p>
<a id="go" href="https://ftp-registry-tribute-what.trycloudflare.com/wh/apply">바로 열기</a>
</div>
<script>
(function(){
  var fb = "https://ftp-registry-tribute-what.trycloudflare.com/wh/apply", q = location.search + location.hash;   // fb = 발행 시점 주소(폴백)
  function go(u){ try{ document.getElementById('go').href = u; }catch(e){} location.replace(u); }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', 'target.txt?t=' + Date.now(), true);
    x.timeout = 5000;
    // target.txt 에는 기본 주소만 들어있으므로 신청 경로(/wh/apply)를 붙여야 한다
    x.onload = function(){
      var b = (x.responseText || '').trim();
      go(/^https:\/\//.test(b) ? b.replace(/\/$/, '') + '/wh/apply' + q : fb + q);
    };
    x.onerror = x.ontimeout = function(){ go(fb + q); };
    x.send();
  } catch(e) { go(fb + q); }
})();
</script>
</body></html>
