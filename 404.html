</head><body><div class="b">
<img src="https://hyunjongki.github.io/youth/nongtus.png" alt="농투스">
<p>🌾 복합형 농촌일손여행 참가신청으로<br>이동 중입니다…</p>
<p id="m" style="font-size:12.5px;color:#5b7c8d"></p>
<a id="go" href="https://floral-maiden-governor-lying.trycloudflare.com/wh/enter?to=apply">바로 열기</a>
</div>
<script>
(function(){
  var fb = "https://floral-maiden-governor-lying.trycloudflare.com/wh/enter?to=apply", q = location.search;   // fb = 발행 시점 주소(폴백)
  // 원래 출처(링커리어·인스타 등)를 넘긴다 — 관문을 거치면 referrer 가 관문 주소로 바뀌어 출처가 사라지기 때문.
  // 경로·검색어는 빼고 도메인 수준만 쓰도록 서버에서 다시 자른다.
  if (document.referrer && !/[?&]ref=/.test(q)) {
    q += (q ? '&' : '?') + 'ref=' + encodeURIComponent(document.referrer.split('?')[0]);
  }
  function go(u){ try{ document.getElementById('go').href = u; }catch(e){} location.replace(u); }
  // fb 에는 이미 '?' 가 있으므로 추가 파라미터는 '&' 로 잇는다(예전엔 '?' 가 두 번 붙어 깨졌음)
  var fq = q ? '&' + q.replace(/^\?/, '') : '';
  try {
    var x = new XMLHttpRequest();
    x.open('GET', 'target.txt?t=' + Date.now(), true);
    x.timeout = 5000;
    // target.txt 에는 기본 주소만 들어있으므로 진입 경로를 붙여야 한다.
    // /wh/enter 를 거치면 세션이 복합형 전용 모드로 고정된다(일반형 화면 미노출).
    x.onload = function(){
      var b = (x.responseText || '').trim();
      var tail = '/wh/enter?to=apply' + fq;
      go(/^https:\/\//.test(b) ? b.replace(/\/$/, '') + tail : fb + fq);
    };
    x.onerror = x.ontimeout = function(){ go(fb + fq); };
    x.send();
  } catch(e) { go(fb + fq); }
})();
</script>
