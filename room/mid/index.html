<script>
(function(){
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ymd(x){ var p = String(x).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function phaseNow(d){            // 기기 날짜로 계산 — 저장본이 오래돼도 D-day·일차가 맞게
    if (!d.start || !d.end) return d.phase || '-';
    var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    var s = ymd(d.start), e = ymd(d.end), day = 86400000;
    if (t < s) return '입소 D-' + Math.round((s - t) / day);
    if (t <= e) return Math.round((t - s) / day + 1) + '일차 / ' + Math.round((e - s) / day + 1) + '일';
    return '활동 종료';
  }
  function render(d, live){
    el('phase').textContent = phaseNow(d);
    var now = new Date(), iso = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
    var stale = d.date && d.date !== iso;
    el('today').textContent = (d.today || '') + (stale ? ' — 저장본 기준(최신 일정은 공지·단톡방 확인)' : '');
    var n = d.notices || [];

           + (x.body ? '<div class="bd">' + esc(x.body) + '</div>' : '')
           + ((x.files || []).length ? '<div class="fl">' + x.files.map(function(f){
               return '<div class="fi"><div class="fn">' + esc(f.label) + (f.size ? ' <span class="fs">PDF ' + esc(f.size) + '</span>' : '') + '</div>'
                    + '<div class="fb"><a href="' + esc(f.url) + '" target="_blank" rel="noopener">열기</a>'

               + '<div class="fh">' + (/KAKAOTALK/i.test(navigator.userAgent)

    }).join('') : '<div class="none">아직 등록된 공지가 없습니다.</div>';
    function acts(a){ return a.map(function(x){ return '<div class="ac"><div class="k">' + esc(x.slot) + '</div><div>' + esc(x.title)
                      + (x.place ? ' <span style="color:#6a776f">· ' + esc(x.place) + '</span>' : '') + '</div></div>'; }).join(''); }
    function plan(items, all){ return (items || []).filter(function(x){ return all || (x.cat !== 'prep' && x.cat !== 'move'); }).map(function(x){
        return '<div class="pi" style="background:' + esc(x.color || '#fff') + '"><div class="k">' + esc(x.time || '') + '</div><div><b>'
             + esc(x.title) + '</b>' + (x.detail ? '<div class="d">' + esc(x.detail) + '</div>' : '') + '</div></div>'; }).join(''); }
    var days = d.plan_days || [], tday = null, before = false;
    for (var i = 0; i < days.length; i++) { if (days[i].date === iso) tday = days[i]; }
    if (!tday && days.length && iso < days[0].date) { tday = days[0]; before = true; }
    var top = '';
    if (tday) {
      top = (before ? '<div style="font-weight:800;font-size:13px;color:#0c5a27">입소일 ' + esc(tday.label) + ' 일정</div>' : '')

      var open = (tday && x.date === tday.date) ? ' open' : '';

    }).join('') || '<div class="none">일정 준비 중입니다.</div>';

    el('svl').innerHTML = sv.map(function(x){

    }).join('') + (sv.length ? '<div class="svh">응답 방법: 문자·카톡으로 받은 <b>내 활동 페이지</b> → 🗳 설문(맨 위 주황 배너) · 3분이면 끝나요</div>' : '');
    LAST = d; photos();

  }
  // ── 현장 사진: 파일은 운영 서버가 보낸다(공개 저장소에 사진을 올리지 않음) → 서버 주소(PB)를 알면 그린다
  var LAST = null, PB = '', SETS = [], PSIG = '';
  function photos(){
    var ds = (LAST && LAST.photos) || [];
    var sig = PB + '|' + JSON.stringify(ds);
    if (sig === PSIG) return;                    // 같은 내용이면 다시 그리지 않는다(불러온 사진 유지)
    PSIG = sig;
    if (!ds.length) { el('photos').innerHTML = '<div class="none">아직 올라온 사진이 없습니다.</div>'; return; }
    if (!PB) { el('photos').innerHTML = '<div class="none">사진을 불러오는 중… (운영 서버에 연결되면 보입니다)</div>'; return; }
    SETS = [];
    el('photos').innerHTML = ds.map(function(day, i){
      var n = 0;
      var eager = i < 2;                         // 펼쳐 둔 최근 2일은 바로, 나머지는 펼칠 때 불러온다
      var body = day.progs.map(function(g){
        var k = SETS.push(g.items) - 1; n += g.items.length;
        return '<div class="pg"><b>' + esc(g.name) + '</b> <span style="color:#6a776f;font-size:12px">' + g.items.length + '장</span><div class="pgr">'
             + g.items.map(function(it, j){ return '<a href="#" data-s="' + k + '" data-i="' + j + '"><img' + (eager ? '' : ' loading="lazy"') + ' src="' + esc(PB + it.p) + '" alt="' + esc(it.cap || g.name) + '" onerror="this.parentNode.style.display=&quot;none&quot;"></a>'; }).join('')
             + '</div></div>';
      }).join('');
      return '<details class="pd"' + (i < 2 ? ' open' : '') + '><summary>' + esc(day.label) + '<small>' + n + '장</small></summary>' + body + '</details>';
    }).join('');
  }
  var lb = el('lb'), li = el('lbi'), cur = null, ci = 0, pushed = false;
  function lbShow(i){ ci = (i + cur.length) % cur.length; var it = cur[ci];
    li.src = PB + it.p + '?s=l'; el('lbc').textContent = it.cap || ''; el('lbn').textContent = cur.length > 1 ? (ci + 1) + ' / ' + cur.length : '';
    el('lbp').style.display = el('lbnx').style.display = cur.length > 1 ? '' : 'none'; }
  function lbClose(pop){ if (!lb.classList.contains('on')) return; lb.classList.remove('on'); li.removeAttribute('src');
    document.documentElement.style.overflow = ''; if (pushed && !pop) { try { history.back(); } catch(e){} } pushed = false; }
  el('photos').addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[data-s]'); if (!a) return; e.preventDefault();
    cur = SETS[+a.getAttribute('data-s')]; lbShow(+a.getAttribute('data-i')); lb.classList.add('on');
    document.documentElement.style.overflow = 'hidden'; try { history.pushState({lb: 1}, ''); pushed = true; } catch(e){}
  });
  window.addEventListener('popstate', function(){ lbClose(true); });
  el('lbx').onclick = function(){ lbClose(); };
  el('lbp').onclick = function(e){ e.stopPropagation(); lbShow(ci - 1); };
  el('lbnx').onclick = function(e){ e.stopPropagation(); lbShow(ci + 1); };
  lb.addEventListener('click', function(e){ if (e.target === lb) lbClose(); });
  var sx = null;
  lb.addEventListener('touchstart', function(e){ sx = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive: true});
  lb.addEventListener('touchend', function(e){ if (sx === null || !cur) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50 && cur.length > 1) lbShow(ci + (dx < 0 ? 1 : -1)); });
  function get(url, ms, ok, bad){
    try {
      var x = new XMLHttpRequest(); x.open('GET', url, true); x.timeout = ms;
      x.onload = function(){ if (x.status >= 200 && x.status < 300) { try { ok(JSON.parse(x.responseText)); return; } catch(e){} } bad(); };
      x.onerror = x.ontimeout = bad; x.send();
    } catch(e) { bad(); }
  }
  var snap = null;
  try { snap = JSON.parse(document.getElementById('snap').textContent); render(snap, false); } catch(e){}
  // 저장본 최신화(정적 data.json) → 서버 실시간(target.txt → /wh/room/MID.json)
  get('data.json?t=' + Date.now(), 5000, function(d){ snap = d; render(d, false); live(); }, live);
  function live(){
    try {
      var x = new XMLHttpRequest(); x.open('GET', '../../target.txt?t=' + Date.now(), true); x.timeout = 5000;
      x.onload = function(){
        var b = (x.responseText || '').trim().replace(/\/$/, '');
        if (!/^https:\/\//.test(b)) return;
        PB = b; photos();
        get(b + '/wh/room/MID.json?t=' + Date.now(), 4000, function(d){ render(d, true); }, function(){});
      };
      x.send();
    } catch(e){}
  }
})();
</script>
</body></html>
