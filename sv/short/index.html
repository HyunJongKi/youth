<script>
(function(){
  var k = new URLSearchParams(location.search).get('k') || 'participant';
  if (!/^(pre|participant|post)$/.test(k)) k = 'participant';
  function fail(){ document.getElementById('m').innerHTML = '지금은 설문 서버에 연결할 수 없습니다.<br>잠시 뒤 다시 열어 주세요.'; }
  try {
    var x = new XMLHttpRequest(); x.open('GET', '../../target.txt?t=' + Date.now(), true); x.timeout = 6000;
    x.onload = function(){ var b = (x.responseText || '').trim().replace(/\/$/, '');
      if (/^https:\/\//.test(b)) location.replace(b + '/wh/svs/SHORT/' + k); else fail(); };
    x.onerror = x.ontimeout = fail; x.send();
  } catch(e) { fail(); }
})();
